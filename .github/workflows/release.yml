name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Package Windows installer and portable exe
        run: npx electron-builder --win nsis portable --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Single-file web build (double-click in any browser)
        run: npm run build:single
      - uses: softprops/action-gh-release@v2
        with:
          name: Hollowspire ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/Hollowspire.html
