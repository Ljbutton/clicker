name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (creates tag v<version> on this commit)'
        required: true
        default: '0.1.0'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Package Windows installer and portable exe
        run: npx electron-builder --win nsis portable --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Single-file web build (double-click in any browser)
        run: npm run build:single
      - name: Set version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"; else echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Hollowspire ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/Hollowspire.html
